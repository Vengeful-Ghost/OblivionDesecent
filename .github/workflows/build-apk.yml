name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # create releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Same signing key on every run, so the phone installs new builds as updates
      - name: Prepare signing key
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > ci-debug.keystore
          else
            keytool -genkeypair -keystore ci-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false

      # Until the DEBUG_KEYSTORE secret exists, hand over the key generated above
      - name: Upload new signing key
        if: env.DEBUG_KEYSTORE == ''
        uses: actions/upload-artifact@v7
        with:
          path: ci-debug.keystore
          archive: false
          retention-days: 1
          if-no-files-found: error

      # Obtainium on the phone watches these releases; the tag matches the app's versionName
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.DEBUG_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk OblivionDescent.apk
          gh release create "v1.0.${{ github.run_number }}" OblivionDescent.apk \
            --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" --notes "$NOTES"
