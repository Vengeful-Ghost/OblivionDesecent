name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored, so rebuild it from repo secrets
      - name: Create local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties

      # Same signing key on every run, so the phone installs new builds as updates
      - name: Restore signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      # Until the DEBUG_KEYSTORE secret exists, hand over the key Gradle just generated
      - name: Upload new signing key
        if: env.DEBUG_KEYSTORE == ''
        uses: actions/upload-artifact@v7
        with:
          path: ~/.android/debug.keystore
          archive: false
          retention-days: 1
          if-no-files-found: error
